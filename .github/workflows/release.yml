name: Release
on:
  workflow_dispatch:
    inputs:
      ignore_dependencies_vulnerabilities:
        description: 'Ignore dependency vulnerabilities and proceed with release (not recommended)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-permissions:
    name: Check Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and event
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Workflow runs on branch '${{ github.ref_name }}' – only main allowed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::Workflow was not triggered manually but by '${{ github.event_name }}' – only workflow_dispatch allowed"
            exit 1
          fi
          echo "✅ Branch is main"

      - name: Check repository role
        uses: actions/github-script@v9
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            const allowedRoles = ['admin', 'maintain'];

            if (!allowedRoles.includes(perm.permission)) {
              core.setFailed(
                `::error::${context.actor} has role "${perm.permission}" – needs: ${allowedRoles.join(' or ')}`
              );
            }
            console.log(`✅ ${context.actor} is eligible (${perm.permission})`);

  vite_react_typescript:
    name: Vite React TypeScript
    needs:
      - check-permissions
    uses: ./.github/workflows/vite-react-typescript.yml
    with:
      ignore_dependencies_vulnerabilities: ${{ github.event.inputs.ignore_dependencies_vulnerabilities }}

  version_release:
    name: Version Release
    runs-on: ubuntu-latest
    needs:
      - check-permissions
      - vite_react_typescript
    permissions:
      contents: write
      packages: read
      issues: write
      pull-requests: write

    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Configure npm registry auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: pnpm install

      - name: Install semantic-release
        run: |
          pnpm install \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "StammtischHub Release Bot"
          GIT_AUTHOR_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "StammtischHub Release Bot"
          GIT_COMMITTER_EMAIL: "3667706+stammtischhub-releaser[bot]@users.noreply.github.com"
        run: pnpm semantic-release

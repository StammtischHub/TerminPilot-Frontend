name: Vite React Typescript
on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  dependency-check:
    name: Check dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          image-ref: '.'
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Evaluate Vulnerabilities
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)

          cat trivy-results.json | jq -r '
            .Results[]?.Vulnerabilities[]? |
            "\(.Severity)|\(.PkgName)|\(.InstalledVersion)|\(.FixedVersion // "no fix")|\(.VulnerabilityID)"
          ' | while IFS="|" read -r severity pkg installed fixed cve; do
            case "$severity" in
              CRITICAL) color="\e[35m" ;;  # Magenta
              HIGH)     color="\e[31m" ;;  # rot
              MEDIUM)   color="\e[33m" ;;  # gelb
              LOW)      color="\e[34m" ;;  # blau
            esac
            link="https://nvd.nist.gov/vuln/detail/${cve}"
            echo -e "${color}[${severity}]\e[0m ${pkg}\n\t${installed} -> ${fixed}\n\t${cve} (${link})\n"
          done

          if [ "$count" -gt 0 ]; then
            echo "::warning::Found $count vulnerabilities. See report above."
            exit 1
          else
            echo "No vulnerabilities found."
          fi

  lint_project:
    name: Lint project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: pnpm tsc --noEmit

  unit_test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e_test:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright (mit Browser-Download)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright (nur OS-Deps)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14